[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["DJ008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["stores", "bookings", "config"]
omit = ["*/migrations/*", "config/wsgi.py", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
