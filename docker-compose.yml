# backend と worker で共通の環境変数
x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.development
  DB_HOST: db
  DB_PORT: "5432"
  DB_USER: ${DB_USER:-yoyakuru}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:-yoyakuru_dev}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
  TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-dreami.blog}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
  CHAT_DAILY_LIMIT_PER_TENANT: ${CHAT_DAILY_LIMIT_PER_TENANT:-}
  SETUP_DAILY_LIMIT_PER_TENANT: ${SETUP_DAILY_LIMIT_PER_TENANT:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
  # Googleログイン＋カレンダー連携。リダイレクトURIは https://app.<ドメイン>/accounts/google/login/callback/
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # 料金の表記（LP・支払いの案内）。空なら Stripe の価格から作る
  PLAN_PRICE_LABEL: ${PLAN_PRICE_LABEL:-}
  REDIS_URL: redis://redis:6379/0
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@dreami.blog}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yoyakuru}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-yoyakuru_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yoyakuru}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py seed_dev && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${HOST_WORKSPACE:-.}/backend:/app
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ${HOST_WORKSPACE:-.}/backend:/app
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 開発用のメール受信。送ったメールは http://<開発機のIP>:8025 で確認する（外部には届かない）
  # 画面に認証がないため、トンネルには載せず LAN 内からだけ開く
  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_BIND:-0.0.0.0}:${MAILPIT_UI_PORT:-8025}:8025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    command: sh -c "rm -f .next/dev/lock && npm run dev"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ${HOST_WORKSPACE:-.}/frontend:/app
      - /app/node_modules
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-dreami.blog}
      # LPの「体験」から開く体験用店舗の予約ページ（空なら「準備中」）
      DEMO_STORE_URL: ${DEMO_STORE_URL:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy

  # docker compose --profile tunnel up で起動（cloudflared/ に credentials が必要）
  tunnel:
    image: cloudflare/cloudflared:2024.8.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.dev.yml run
    volumes:
      - ${HOST_WORKSPACE:-.}/cloudflared:/etc/cloudflared:ro
    depends_on:
      - frontend

volumes:
  postgres_data:
